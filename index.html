<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>LIKENESS 2 · phone check 0</title>
<style>
:root{--ink:#ecebe8;--dim:#8b8e94;--ui:#0e0f12;--ui2:#18191d;--ui3:#222429;--line:#26292e;--cy:#a6ecff;--red:#ff5a4a;--amber:#ffbf7a;--blue:#2f6bf0;--gray:#9a9ca3;
--serif:Georgia,"Noto Serif","Droid Serif","Times New Roman",serif;--mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--kb:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
.hidden{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000}

/* the photo layer: rooms, the car, the bay */
#photo{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s,filter 1.2s;background:#000}
#photo.on{opacity:1}
#photo img,#photo canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* the inner phone, in hand */
#os{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;transition:opacity .8s,transform .6s cubic-bezier(.3,.8,.3,1),height .6s cubic-bezier(.3,.8,.3,1),top .6s cubic-bezier(.3,.8,.3,1);z-index:2}
#sb{flex:none;height:calc(30px + var(--sat));padding:var(--sat) 20px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.02em;position:relative;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#sb .r{display:flex;gap:7px;align-items:center}
#sb svg{width:15px;height:15px;fill:currentColor}
#bat{display:inline-flex;align-items:center;gap:4px}
#goal{flex:none;padding:3px 14px 6px;font-size:12px;color:#c9c6bf;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border-bottom:1px solid var(--line);position:relative;z-index:3}
#goal .gl{flex:1 1 100%;letter-spacing:.01em}
#goal .nm{font-weight:650;color:#efece6;transition:opacity 1.5s,color 1.5s}
#goal .nm.dim{opacity:.28;text-decoration:line-through;text-decoration-thickness:1px}
#goal .gt{margin-left:auto;font-variant-numeric:tabular-nums;color:#8b8e94}
#goal.gray,#goal.gray .nm{color:#6c6e73}
#scr{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scrIn .35s ease-out}
@keyframes scrIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

/* in a room: the phone shrinks to a strip along the bottom */
#app.strip #os{top:auto;height:min(46%,calc(300px + var(--sab)));bottom:0;border-radius:18px 18px 0 0;background:rgba(8,9,11,.94);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#app.strip #sb{height:26px;padding-top:0}
/* away: the photo alone, no interface */
#app.away #os{opacity:0;pointer-events:none;transform:translateY(30%)}
#app.away #banner{display:none}
/* eyes closed: black; sound and text only */
#eyes{position:absolute;inset:0;background:#000;z-index:30;opacity:0;pointer-events:none;transition:opacity 1.4s}
#app.eyes #eyes{opacity:1;pointer-events:auto}
#app.eyes #banner{display:none}

#cine{position:absolute;inset:0;z-index:40;display:none;background:#000;overflow:hidden;touch-action:none}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}

/* banners */
#banner{position:absolute;left:10px;right:10px;top:calc(8px + var(--sat));z-index:55;pointer-events:none}
.bn{background:rgba(32,34,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:bnIn .45s cubic-bezier(.2,.9,.3,1.2);margin-bottom:6px}
.bn.out{animation:bnOut .35s ease-in forwards}
@keyframes bnIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes bnOut{to{transform:translateY(-120%);opacity:0}}
.ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.ic svg{width:60%;height:60%;fill:#fff}
.bn .t{font-size:13px;color:#bfc2c8;display:flex;justify-content:space-between;gap:8px}
.bn .t b{color:#fff;font-weight:600}
.bn .m{font-size:14.5px;margin-top:1px;color:#f2f2f2}

/* thoughts */
#thought{position:absolute;inset:0;z-index:58;display:none;align-items:flex-end;justify-content:center;padding:0 18px calc(34px + var(--sab));background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 35%,rgba(0,0,0,0) 70%)}
#thought.on{display:flex}
#thought.free{pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 40%)}
#thought .tx{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:#ddd8cf;max-width:560px;width:100%;text-shadow:0 2px 12px #000;min-height:3em}
#thought .tx .c{opacity:0;transition:opacity .25s}
#thought .tx .c.v{opacity:1}
#thought .go{position:absolute;bottom:calc(14px + var(--sab));left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#777;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}

/* subtitles for the copy's voice */
#sub{position:absolute;left:16px;right:16px;bottom:calc(120px + var(--sab));z-index:57;text-align:center;pointer-events:none;font-family:var(--serif);font-size:18px;line-height:1.45;color:#f0f0f0;text-shadow:0 2px 8px #000,0 0 2px #000;opacity:0;transition:opacity .3s}
#sub.on{opacity:1}
#sub .fa{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:#9a9ca3;margin-bottom:3px;text-transform:lowercase}
#sub.faint .ln{opacity:.6}
#app.strip #sub{bottom:calc(min(46%,calc(300px + var(--sab))) + 16px)}

/* the edge pulse that doubles every vibration */
#edge{position:absolute;inset:0;z-index:56;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}
#edge.go{animation:edgeP .5s ease-out}
@keyframes edgeP{0%{opacity:1;box-shadow:inset 0 0 18px 4px rgba(220,225,235,.55)}100%{opacity:0;box-shadow:inset 0 0 40px 10px rgba(220,225,235,0)}}

.fade{position:absolute;inset:0;background:#000;z-index:57;pointer-events:none;opacity:0;transition:opacity 1.2s}
.fade.on{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.glitch #os,.glitch #cine{animation:gl .12s steps(2) infinite}
@keyframes gl{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-4px,1px) skewX(-2deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,2px) skewX(1.5deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* lock */
.lock{align-items:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.lock .clk{font-size:84px;font-weight:200;letter-spacing:-.02em;margin-top:5vh;line-height:1;font-variant-numeric:tabular-nums}
.lock .dt{font-size:17px;font-weight:500;opacity:.9;margin-top:6px}
.lock .nl{width:100%;flex:1;overflow-y:auto;padding:22px 10px 10px;display:flex;flex-direction:column;gap:7px;-webkit-mask:linear-gradient(to bottom,transparent,#000 18px)}
.lock .nl .bn{animation:nIn .5s ease-out;margin:0;text-shadow:none;background:rgba(28,30,36,.78)}
@keyframes nIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.lock .bar{width:130px;height:5px;border-radius:3px;background:#fff;opacity:.8;margin-bottom:calc(8px + var(--sab))}

/* home */
.home{padding:10px 18px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:28px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#e9e9e9;position:relative}
.app .ic{width:60px;height:60px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.app.off{opacity:.38}
.app .badge{position:absolute;top:-5px;right:calc(50% - 38px);background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #000}
.app.nope{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.homebtn{margin:18px auto 0;display:block;padding:12px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.22);background:rgba(16,16,20,.6);font-family:var(--serif);font-style:italic;font-size:16px;color:#e6e2da}

/* app chrome */
.appv{background:var(--ui)}
.appv.white{background:#fbfbfa;color:#1d1d20}
.appv.white .hd{border-color:#e6e6e3}
.hd{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px 10px;border-bottom:1px solid var(--line);min-height:52px}
.hd .bk{font-size:28px;line-height:1;padding:0 10px 4px 4px;color:#7fa6ff}
.hd .bk.hid{visibility:hidden}
.hd .tt{flex:1;font-weight:650;font-size:17px;text-align:center;margin-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:active{background:var(--ui2)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:18px;color:#fff}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:650;display:flex;justify-content:space-between;gap:8px}
.row .pv{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* threads */
.th{padding:14px 12px 20px;display:flex;flex-direction:column;gap:4px}
.ts{align-self:center;font-size:11.5px;color:#777;margin:12px 0 6px}
.bu{max-width:78%;padding:9px 13px;border-radius:19px;font-size:15.5px;line-height:1.32;animation:buIn .3s ease-out;word-wrap:break-word;white-space:pre-wrap}
@keyframes buIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bu.l{align-self:flex-start;background:var(--ui3);border-bottom-left-radius:6px}
.bu.r{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.white .bu.l{background:#ececea;color:#1d1d20}
.cap{font-size:11px;color:#7c7f86;align-self:flex-end;margin:0 6px 6px}
.cap.l{align-self:flex-start}
.bu.ty{display:flex;gap:4px;padding:13px 15px}
.bu.ty i{width:7px;height:7px;border-radius:50%;background:#999;animation:tyd 1.2s infinite}
.bu.ty i:nth-child(2){animation-delay:.15s}.bu.ty i:nth-child(3){animation-delay:.3s}
.bu.r.ty i{background:#cfdcff}
@keyframes tyd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.tray{flex:none;padding:10px 10px calc(10px + var(--sab));border-top:1px solid var(--line);background:#0b0c0e;display:flex;flex-direction:column;gap:8px;min-height:62px}
.white .tray{background:#f1f1ef;border-color:#e2e2df}
.chip{border:1.5px solid #3d6fe8;color:#cfe0ff;border-radius:20px;padding:10px 15px;text-align:left;font-size:15px;animation:buIn .35s ease-out backwards;background:rgba(47,107,240,.08)}
.chip:active{background:rgba(47,107,240,.35)}
.chip.dim{border-color:#333;color:#666;background:none}
/* its better line, in gray, with "Let me" (class gline) */
.gline{display:flex;gap:10px;align-items:center;color:var(--gray);font-size:14.5px;padding:2px 4px}
.gline .gt{flex:1;font-style:italic}
.gline button{flex:none;border:1px solid #55585f;border-radius:14px;padding:6px 11px;font-size:13px;color:#c8cad0}

/* the field the game draws: a real text box over a layer that shows the copy's marks */
.field{position:relative;border:1px solid #2c2f35;border-radius:20px;background:#121316;min-height:42px}
.field .mir,.field textarea{display:block;width:100%;margin:0;border:0;padding:10px 14px;font-size:16px;line-height:1.35;font-family:inherit;letter-spacing:normal;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;min-height:42px;max-height:120px;overflow-y:auto}
.field .mir{position:absolute;inset:0;color:#eee;pointer-events:none}
.field .mir .ch{border-bottom:2px dotted #c9c2ff;color:#d9d2ff}
.field textarea{position:relative;background:transparent;color:transparent;caret-color:#9fc0ff;resize:none;outline:none;-webkit-text-fill-color:transparent}
.field textarea::placeholder{color:#555;-webkit-text-fill-color:#555}
.white .field{background:#fff;border-color:#d8d8d4}.white .field .mir{color:#1d1d20}

/* hold anywhere: one finger, a ring that fills */
.hold{position:absolute;inset:0;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:5}
.hold svg{width:132px;height:132px;transform:rotate(-90deg);opacity:.85}
.hold .bgc{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4}
.hold .fgc{fill:none;stroke:#e9e5dc;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear}

/* title */
.ttl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center;padding:24px}
.ttl h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,13vw,72px);letter-spacing:.32em;margin-left:.32em;color:#f3f1ec;text-shadow:3px 0 rgba(255,60,60,.35),-3px 0 rgba(80,220,255,.35)}
.ttl .warn{font-size:13px;color:#8a8a8a;margin-top:40px;line-height:1.9;letter-spacing:.04em}
.ttl .begin{margin-top:36px;font-family:var(--mono);font-size:14px;letter-spacing:.4em;padding:16px 26px;border:1px solid #444;animation:pulse 2.2s infinite}
.ttl .cont{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:#888;padding:10px}
.ttl input{margin-top:26px;background:none;border:0;border-bottom:1px solid #555;color:#fff;font-size:26px;text-align:center;width:min(80vw,320px);padding:8px;font-family:var(--serif);outline:none;border-radius:0}
.ttl .q{font-family:var(--serif);font-style:italic;font-size:21px;color:#ddd}
.ttl .two{display:flex;gap:14px;margin-top:36px}
.ttl .two button{font-family:var(--mono);font-size:13px;letter-spacing:.25em;padding:14px 18px;border:1px solid #444}
.ttl .arrow{margin-top:26px;width:52px;height:52px;border-radius:50%;border:1px solid #444;font-size:22px;color:#ccc}
.ends{margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#6d7076;line-height:2}
.ends b{color:#bbb;font-weight:400}
.stub{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#555;padding:30px;text-align:center}

/* settings */
.setp{position:absolute;inset:0;z-index:45;background:#050506;display:flex;flex-direction:column;padding:calc(10px + var(--sat)) 18px calc(18px + var(--sab));overflow-y:auto;animation:fadeIn .3s}
.setp .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.setp .sh .bk{font-size:30px;line-height:1;padding:0 12px 4px 0;color:#bbb}
.setp h3{font-family:var(--mono);font-size:12px;letter-spacing:.35em;color:#888;font-weight:400}
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #1d1f23}
.srow .l{flex:1}.srow .l b{display:block;font-weight:600;font-size:16px}.srow .l small{color:#80838a;font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:#3a3c42;position:relative;transition:background .25s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.sw.dis{opacity:.35}
.slider{width:100%;accent-color:#c9c2ff;height:30px}

/* the help corner: "Skip ›" while someone talks, "?" when it's your move */
#corner{position:absolute;top:calc(40px + var(--sat));right:10px;z-index:59;display:none;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 14px;border-radius:17px;background:rgba(16,16,20,.86);border:1px solid rgba(255,255,255,.22);color:#e8e4dc;font-size:13.5px;font-weight:600;letter-spacing:.04em;box-shadow:0 2px 10px rgba(0,0,0,.5);animation:fadeIn .25s;transition:transform .25s}
#corner.on{display:flex}
#corner.hint{padding:0;width:34px;font-family:var(--serif);font-size:18px;font-weight:700}
#corner.skipping{opacity:.6;pointer-events:none}
.card{position:absolute;inset:0;z-index:59;background:rgba(0,0,0,.5);animation:fadeIn .2s}
.card .hc{position:absolute;left:12px;right:12px;top:calc(40px + var(--sat));max-width:520px;margin:0 auto;background:#141519;border:1px solid #2c2e34;border-radius:18px;padding:16px 16px 12px;color:#e6e3dc;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.card.mid .hc{top:30%}
.card .hh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:#c9bcff;margin-bottom:10px}
.card p{font-size:15.5px;line-height:1.45;margin:0 0 10px;color:#9d9a94}
.card p.new{color:#f2efe8}
.card .hb{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.card .hb button{padding:10px 15px;border-radius:12px;font-size:14px;font-weight:600;color:#c8c5be;background:#23242b}
.card .hb button.more{color:#fff;background:#4a3d8c}

/* the return tap after the page was hidden: one tap brings back full screen, sound and the awake screen */
#ret{position:absolute;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center}
#ret i{width:9px;height:9px;border-radius:50%;background:#555;animation:pulse 1.8s infinite}

/* larger text */
#app.big #thought .tx{font-size:23px}#app.big .bu{font-size:18px}#app.big .chip{font-size:17.5px}#app.big #sub{font-size:21px}
#app.big .bn .m{font-size:16.5px}#app.big .row .pv{font-size:16px}#app.big .card p{font-size:18px}#app.big .field .mir,#app.big .field textarea{font-size:18.5px}
#app.big #goal{font-size:14px}#app.big .gline{font-size:16.5px}

/* the phone check page: a plain scrolling page, not the game */
#app.check{overflow:hidden}
#page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--sat)) 14px calc(40px + var(--sab));font-size:15.5px;line-height:1.45;color:#e8e6e1}
#page h1{font-family:var(--mono);font-size:13px;letter-spacing:.25em;color:#bbb;font-weight:500;margin:4px 0 10px}
#page .lead{color:#a9a7a2;margin-bottom:14px}
.ck{background:#111215;border:1px solid #26282d;border-radius:14px;padding:13px 14px;margin:12px 0}
.ck h2{font-size:16px;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.ck h2 .n{font-family:var(--mono);color:#888;font-size:13px}
.ck h2 .opt{font-family:var(--mono);color:#777;font-size:11px;letter-spacing:.1em;margin-left:auto}
.ck ol{margin:6px 0 8px 20px;color:#cfccc6}
.ck ol li{margin:3px 0}
.ck .btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ck button.b{border:1px solid #4a4d55;border-radius:10px;padding:10px 13px;background:#1b1d22;color:#eee;font-size:14.5px}
.ck button.b.go{border-color:#6f5fd1;background:#2a2450}
.ck button.b.yes{border-color:#2e7d4a}.ck button.b.no{border-color:#8a3b33}
.ck button.b.sel{outline:2px solid #fff}

<body>
<div id="app" class="check">
 <div id="page"></div>
 <div id="cine"></div>
 <div id="sub"></div>
 <div id="edge"></div>
</div>
<script>
'use strict';
const BUILD = {"release":false,"at":"2026-10-24T18:17:54.747Z"};
/* ===== core.js ===== */
/* ================= CORE: small helpers, and scopes that clean up after themselves ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 1, b) => b == null ? Math.random() * a : a + Math.random() * (b - a);

function h(tag, a = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in a) {
    const v = a[k];
    if (k === 'cls') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(k => k != null && k !== false && e.append(k.nodeType ? k : document.createTextNode(k)));
  return e;
}

// A scope owns every timer, interval and listener started inside it. Ending the scope stops them all,
// so a scene change or a restart can never leave something running (the current game's listeners piled up).
// A wait() inside an ended scope simply never resolves, so the code after it never runs.
function makeScope(name) {
  const timers = new Set(), intervals = new Set(), offs = new Set(), kids = new Set();
  const s = {
    name, alive: true,
    after(ms, fn) { if (!s.alive) return 0; const id = setTimeout(() => { timers.delete(id); if (s.alive) fn(); }, ms); timers.add(id); return id; },
    every(ms, fn) { if (!s.alive) return 0; const id = setInterval(() => { if (s.alive) fn(); }, ms); intervals.add(id); return id; },
    clear(id) { clearTimeout(id); clearInterval(id); timers.delete(id); intervals.delete(id); },
    on(target, ev, fn, opt) { if (!s.alive) return () => {}; target.addEventListener(ev, fn, opt); const off = () => { target.removeEventListener(ev, fn, opt); offs.delete(off); }; offs.add(off); return off; },
    onEnd(fn) { const f = () => { offs.delete(f); fn(); }; if (s.alive) offs.add(f); else fn(); return f; },
    wait(ms) { return new Promise(r => s.after(ms, r)); },
    until(fn, every = 150) { return new Promise(r => { const c = () => fn() ? r() : s.after(every, c); c(); }); },
    child(n) { const c = makeScope(n); kids.add(c); const end = c.end; c.end = () => { kids.delete(c); end(); }; return c; },
    end() {
      if (!s.alive) return; s.alive = false;
      kids.forEach(k => k.end()); kids.clear();
      timers.forEach(clearTimeout); intervals.forEach(clearInterval); [...offs].forEach(f => f());
      timers.clear(); intervals.clear(); offs.clear();
    },
    count() { let n = timers.size + intervals.size + offs.size; kids.forEach(k => n += k.count()); return n; }
  };
  return s;
}

// G.run is the scope of the current play: title, game, or check page. A restart ends it and starts a new one.
const G = { run: makeScope('run') };
const wait = ms => G.run.wait(SKIP.on && ms > 120 ? 40 : ms);
const until = fn => G.run.until(fn);

/* skipping ahead: talk fast-forwards until the next choice, or until you touch the screen (from the current game) */
const SKIP = { on: false, last: 0, act: 0 };
const skipping = () => SKIP.on;
const skipEnd = () => { SKIP.on = false; };
const talked = () => { SKIP.act = Date.now(); if (SKIP.on) SKIP.last = Date.now(); };

// A tiny event hub, so device signals (hidden, shown, online) reach whoever listens without knowing them.
const Bus = (() => {
  const m = {};
  return {
    on(ev, fn, scope = G.run) { (m[ev] = m[ev] || new Set()).add(fn); const off = () => m[ev] && m[ev].delete(fn); if (scope) scope.onEnd(off); return off; },
    emit(ev, d) { (m[ev] ? [...m[ev]] : []).forEach(f => { try { f(d); } catch (e) { setTimeout(() => { throw e; }); } }); }
  };
})();

// game time as the phone shows it, from minutes after midnight
function fmtTime(min, ampm) {
  const m = ((Math.round(min) % 1440) + 1440) % 1440, hh = Math.floor(m / 60) % 12 || 12, mm = m % 60;
  return hh + ':' + (mm < 10 ? '0' : '') + mm + (ampm ? (m < 720 ? ' AM' : ' PM') : '');
}

/* ===== text.js ===== */
/* ================= TEXT: every line players read or hear, and nothing else =================
   Every string here comes from docs/08-map.md (and, from step 3, script/11-script.md).
   A line neither contains is NEED('what it must do'); it shows as [TEXT NEEDED: ...] and is listed in STATUS.md.
   "[Name]" is the typed name. Nothing player-facing may be written anywhere else in the code. */
const NEED = what => ({ need: what });
const TEXT = {
  // scene 0 (map §2, "0. Before you start")
  title: 'LIKENESS',
  titleLines: ['Lights off. Sound on.', 'Hold it the way you do in bed.', 'About an hour.'],
  begin: 'BEGIN', cont: 'CONTINUE', settings: 'SETTINGS',
  endings: { original: 'THE ORIGINAL', shared: 'SHARED', breakfast: 'BREAKFAST', erased: 'ERASED' },
  unfound: '? ? ?',
  soundQ: 'Earbuds or the speaker?',
  earbuds: 'Earbuds', speaker: 'Speaker', // the two answers, in the question's own words
  nameQ: 'Whose phone is this?',
  defaultName: 'Sam',
  set: {
    camera: 'Camera', vib: 'Vibration', pitch: 'Its voice', pitchSub: "Adjust the copy's voice",
    pitchSample: NEED('a short line the copy speaks when the pitch slider is let go, so the player hears the voice; it must not spoil its first words in scene 3'),
    voice: 'Spoken voice', big: 'Larger text', calm: 'Reduce flashing', tap: 'Tap instead of hold',
    noVib: NEED('why Vibration is greyed out: this phone or browser cannot vibrate'),
    noCam: NEED('why Camera is greyed out: this browser cannot use the camera when the game is opened this way')
  },
  // help (map §2: "?" with three-step hints; "Skip ›" while someone talks)
  help: { hint: '?', skip: 'Skip ›', skipping: 'Skip ›',
    more: NEED('hint card button: show the next hint'), tell: NEED('hint card button: show the last hint, which gives the answer'),
    close: NEED('hint card button: close the hints') },
  // the back gesture at the home screen (map §5 table)
  leave: { q: 'Leave?', spoken: "Leaving? I'll be here.", stay: NEED('button: stay in the game'), go: NEED('button: leave the game') },
  // inner phone
  airplaneMark: '✈',
  faint: 'faint'
};

const Text = {
  name: () => (Prefs && Prefs.cross.name) || TEXT.defaultName,
  // look up a key like 'set.camera'; fill in the name
  t(key, vars = {}) {
    let v = key.split('.').reduce((o, k) => o == null ? o : o[k], TEXT);
    if (v == null) return `[TEXT NEEDED: missing key ${key}]`;
    return Text.fill(v, vars);
  },
  fill(v, vars = {}) {
    if (Array.isArray(v)) return v.map(x => Text.fill(x, vars));
    if (v && v.need) return `[TEXT NEEDED: ${v.need}]`;
    const name = vars.name || Text.name();
    return String(v).replace(/\[Name\]/g, name).replace(/\[n\]/g, vars.n == null ? '[n]' : vars.n);
  },
  // every [TEXT NEEDED] still in the table, for the step report
  needs() {
    const out = [];
    const walk = (o, p) => { for (const k in o) { const v = o[k], q = p ? p + '.' + k : k; if (v && v.need) out.push(q + ': ' + v.need); else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, q); } };
    walk(TEXT, ''); return out;
  },
  // every string the game may show, with the name filled in, for the automatic text audit
  all(name) {
    const out = new Set();
    const walk = o => { if (typeof o === 'string') out.add(Text.fill(o, { name })); else if (Array.isArray(o)) o.forEach(walk); else if (o && o.need) out.add(Text.fill(o)); else if (o && typeof o === 'object') Object.values(o).forEach(walk); };
    walk(TEXT); return out;
  }
};
const tt = (k, v) => Text.t(k, v);

/* ===== prefs.js ===== */
/* ================= SAVING: what the phone keeps =================
   Across plays (saved the moment they change): name, settings, mix, pitch, endings found with their game times.
   The night is saved only at scene starts (step 2). Never saved, anywhere: typed text, the camera frame.
   Writes go through a whitelist, so nothing else can reach storage by accident. */
const KEYS = { cross: 'likeness2.cross', night: 'likeness2.night' };
const ENDING_IDS = ['original', 'shared', 'breakfast', 'erased'];
const DEFAULT_SETTINGS = () => ({
  camera: true, vib: true, pitch: 0.5, voice: true, big: false,
  // "Reduce flashing (on if the phone asks for reduced motion)"
  calm: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
  tap: false
});

const Prefs = (() => {
  const store = (() => { try { const k = '__l2t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  const read = k => { try { return JSON.parse((store && store.getItem(k)) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { store && store.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // keep only known fields of the right type
  function cleanCross(o) {
    const d = DEFAULT_SETTINGS(), s = (o && o.settings) || {}, settings = {};
    for (const k in d) settings[k] = typeof s[k] === typeof d[k] ? s[k] : d[k];
    settings.pitch = clamp(+settings.pitch || 0, 0, 1);
    const endings = {};
    const e = (o && o.endings) || {};
    ENDING_IDS.forEach(id => { if (typeof e[id] === 'string' && /^\d{1,2}:\d\d [AP]M$/.test(e[id])) endings[id] = e[id]; });
    let name = o && typeof o.name === 'string' ? o.name.replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 24) : '';
    return { v: 1, name, settings, mix: o && (o.mix === 'speaker' || o.mix === 'earbuds') ? o.mix : null, endings };
  }

  const cross = cleanCross(read(KEYS.cross));
  const api = {
    cross, KEYS, available: !!store,
    save() { write(KEYS.cross, cleanCross(cross)); },
    set(k, v) { cross.settings[k] = v; api.save(); Bus.emit('settings', cross.settings); },
    setName(n) { cross.name = cleanCross({ name: n }).name; api.save(); },
    setMix(m) { cross.mix = m; api.save(); Bus.emit('settings', cross.settings); },
    found(id, time) { if (ENDING_IDS.includes(id)) { cross.endings[id] = time; api.save(); } },
    // the night (step 2 fills in what a night holds; here only the whitelist hook)
    readNight: () => read(KEYS.night),
    writeNight(n) { write(KEYS.night, n); },
    wipeNight() { try { store && store.removeItem(KEYS.night); } catch (e) {} },
    cleanCross
  };
  return api;
})();

/* ===== device.js ===== */
/* ================= DEVICE: the real phone =================
   Full screen, the screen kept awake, the iPhone silent-switch fix, vibration, battery, the back gesture,
   the online flag, and the raw detector for the page being hidden (a lock, an app switch, the screen going off).
   What a hide MEANS (put down, interruption, nothing) is decided by the night engine in step 2. */
const Device = (() => {
  const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const UA = navigator.userAgent || '';
  const FIREFOX = /Firefox\//.test(UA); // Firefox for Android reports success but never vibrates (07 §4.8)
  const api = {
    framed: FRAMED,
    canVibrate: !!navigator.vibrate && !FRAMED && !FIREFOX,
    canCamera: !FRAMED && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    battery: { real: false, level: 0.71, charging: false }, // a fixed value where the real one can't be read
    online: navigator.onLine !== false,
    hidden: document.hidden,
    hiddenAt: 0,
    playing: false,       // true while a play is running: hides then need the return tap
    ignoreHides: false,   // true while the browser's own camera prompt is showing (map scene 6)
    log: []               // what the detector saw, for the test page and the test panel
  };
  const note = (what, extra) => { api.log.push(Object.assign({ what, t: Math.round(performance.now()) }, extra || {})); if (api.log.length > 80) api.log.shift(); };

  /* full screen and the awake screen: both need a tap */
  let lock = null;
  api.full = async () => {
    const d = document.documentElement, rq = d.requestFullscreen || d.webkitRequestFullscreen;
    if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) { try { await rq.call(d, { navigationUI: 'hide' }); } catch (e) {} }
  };
  api.awake = async () => {
    if (!navigator.wakeLock || document.hidden) return false;
    if (lock && !lock.released) return true;
    try { lock = await navigator.wakeLock.request('screen'); api.awakeError = ''; lock.addEventListener('release', () => note('wake lock released')); return true; }
    catch (e) { api.awakeError = (e && (e.name + ': ' + e.message)) || 'failed'; note('wake lock refused', { why: api.awakeError }); return false; }
  };
  api.isAwake = () => !!(lock && !lock.released);
  api.isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  // iPhone: without this, the ringer switch silences the game (07 §4.6, iOS 17+)
  api.audioSession = () => { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} };

  /* vibration: always doubled by a sound and an edge pulse (map §5), so nothing depends on it */
  api.vibrate = pattern => {
    const el = document.getElementById('edge');
    if (el) { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
    if (api.canVibrate && Prefs.cross.settings.vib) { try { navigator.vibrate(pattern); } catch (e) {} }
  };

  /* battery (Android Chrome and Samsung only) */
  try {
    navigator.getBattery && navigator.getBattery().then(b => {
      const up = () => { api.battery = { real: true, level: b.level, charging: !!b.charging }; Bus.emit('battery', api.battery); };
      up(); b.addEventListener('levelchange', up); b.addEventListener('chargingchange', up);
    }).catch(() => {});
  } catch (e) {}

  /* the online flag: the game never acts on it by itself (map scene 9, W8); it only reports changes */
  addEventListener('online', () => { api.online = true; note('online'); Bus.emit('net', true); }, false);
  addEventListener('offline', () => { api.online = false; note('offline'); Bus.emit('net', false); }, false);

  /* the hide detector */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      api.hidden = true; api.hiddenAt = performance.now();
      note('hidden', { ignored: api.ignoreHides });
      Bus.emit('hidden', { at: api.hiddenAt, ignored: api.ignoreHides });
    } else {
      api.hidden = false;
      const ms = api.hiddenAt ? performance.now() - api.hiddenAt : 0;
      note('shown', { ms: Math.round(ms), ignored: api.ignoreHides });
      Bus.emit('shown', { ms, ignored: api.ignoreHides });
      if (api.playing && !api.ignoreHides) api.askReturn();
      else api.awake();
    }
  });
  // back from the browser's back-forward memory: counts as an ordinary hide and return (map H16)
  addEventListener('pageshow', e => { if (e.persisted) { note('restored from back-forward memory'); Bus.emit('shown', { ms: 0, restored: true }); if (api.playing) api.askReturn(); } });
  addEventListener('pagehide', () => { note('pagehide'); Bus.emit('leaving'); });

  /* the return tap: after any hide during play, one tap brings back full screen, sound and the awake screen */
  api.askReturn = () => {
    if (document.getElementById('ret')) return;
    const app = document.getElementById('app'); if (!app) return;
    const r = h('div', { id: 'ret' }, h('i'));
    r.addEventListener('click', async () => {
      r.remove(); api.audioSession(); Bus.emit('return-tap');
      await api.full(); await api.awake();
      note('return tap', { full: api.isFull(), awake: api.isAwake() });
    });
    app.append(r);
  };

  /* the back gesture: back works inside the game instead of leaving it.
     CloseWatcher where the browser has it, otherwise one history entry. Either is armed only by a tap,
     because Chrome skips entries added without one (07 §4.3). */
  let armed = false, how = '';
  api.back = { enabled: false, handler: null };
  function arm() {
    if (armed || !api.back.enabled) return;
    try {
      if ('CloseWatcher' in window) {
        const w = new CloseWatcher(); how = 'watcher';
        w.onclose = () => { armed = false; note('back (watcher)'); api.back.handler && api.back.handler(); };
        api.back.release = () => { try { w.destroy(); } catch (e) {} armed = false; };
      } else {
        history.pushState({ l2: 1 }, ''); how = 'history';
        api.back.release = () => { armed = false; if (history.state && history.state.l2) history.back(); };
      }
      armed = true;
    } catch (e) {}
  }
  document.addEventListener('pointerdown', arm, true);
  addEventListener('popstate', () => {
    if (how !== 'history' || !armed) return;
    armed = false; note('back (history)');
    api.back.handler && api.back.handler();
  });
  api.back.leave = () => { api.back.enabled = false; if (armed && api.back.release) api.back.release(); setTimeout(() => history.back(), 50); };

  // no long-press menus or text selection anywhere (holds need one finger for ten seconds)
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => { const t = e.target; if (!(t && t.closest && t.closest('input,textarea'))) e.preventDefault(); });
  return api;
})();

/* ===== audio.js ===== */
/* ================= SOUND: everything made live, nothing loaded (reused from the current game's A) =================
   Two families (map §5): the house (wind, wall clock, furnace, plus each place's own sounds) and the copy
   (key clicks, its two-note chime, "dit-dit-dit", the glitch). Everything that matters sits between about
   150 Hz and 5 kHz, so it survives a phone speaker. "Earbuds or the speaker?" picks the mix. */
const A = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, out, eq1, eq2, comp, verbIn, houseBus, noiseB, brownB, shB;
  const L = {}; // running layers
  const api = { ok: false, mix: 'speaker' };

  function mkNoise(sec, kind) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0, hold = 0, hv = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
      else if (kind === 'sh') { if (hold-- <= 0) { hold = 20 + Math.random() * 600; hv = Math.random() * 2 - 1; } d[i] = hv; }
      else d[i] = w;
    }
    return b;
  }
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  // must run inside a tap
  api.init = () => {
    Device.audioSession();
    if (ctx) { api.resume(); return; }
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }
    comp = ctx.createDynamicsCompressor();
    eq1 = ctx.createBiquadFilter(); eq1.type = 'highpass'; eq1.Q.value = 0.7;
    eq2 = ctx.createBiquadFilter(); eq2.type = 'peaking'; eq2.frequency.value = 2500; eq2.Q.value = 0.8;
    out = ctx.createGain(); out.gain.value = 0.85;
    out.connect(eq1); eq1.connect(eq2); eq2.connect(comp); comp.connect(ctx.destination);
    const cv = ctx.createConvolver(); cv.buffer = impulse(3.0, 2.4);
    verbIn = ctx.createGain(); const vr = ctx.createGain(); vr.gain.value = 0.5;
    verbIn.connect(cv); cv.connect(vr); vr.connect(out);
    houseBus = ctx.createGain(); houseBus.gain.value = 1; houseBus.connect(out);
    noiseB = mkNoise(3, 'w'); brownB = mkNoise(6, 'brown'); shB = mkNoise(2, 'sh');
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(out); s.start(0); // iOS unlock
    api.ok = true;
    api.setMix(Prefs.cross.mix || 'speaker');
    api.resume();
  };
  api.resume = () => { if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); };
  api.state = () => ctx ? ctx.state : 'none';
  api.ctx = () => ctx;
  // the speaker mix cuts what a phone speaker can't play and lifts the middle; earbuds get the full range and panning
  api.setMix = m => {
    api.mix = m === 'earbuds' ? 'earbuds' : 'speaker';
    if (!ctx) return;
    const sp = api.mix === 'speaker', t = ctx.currentTime;
    eq1.frequency.setTargetAtTime(sp ? 150 : 40, t, 0.05);
    eq2.gain.setTargetAtTime(sp ? 4 : 0, t, 0.05);
    comp.threshold.setTargetAtTime(sp ? -20 : -14, t, 0.05); comp.ratio.setTargetAtTime(sp ? 6 : 4, t, 0.05);
  };
  Bus.on('settings', () => api.setMix(Prefs.cross.mix), null);
  // a hidden page suspends sound; it comes back with the page, or with the return tap where a phone insists
  document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); });
  Bus.on('return-tap', () => api.resume(), null);

  const T = () => ctx.currentTime;
  function g(v) { const n = ctx.createGain(); n.gain.value = v; return n; }
  function send(node, wet, dry = 1, pan = 0, dest = out) {
    let src = node;

    s.buffer = o.buf || noiseB; f.type = o.ft || 'lowpass'; f.frequency.value = o.f || 1000; f.Q.value = o.q || 0.7;
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);

  /* ---- the copy's sounds ---- */

  api.key = (pan = 0) => { tone(1200, 0.05, { vol: 0.05, pan }); burst(0.015, { ft: 'highpass', f: 3000, vol: 0.05, pan }); };
  api.type = (pan = 0) => burst(0.025, { ft: 'bandpass', f: 2200 + Math.random() * 800, q: 2, vol: 0.06, pan });
  // a burst of its key clicks, as when it types in the dark
  api.clicks = (n = 8, pan = 0) => { for (let i = 0; i < n; i++) { const at = i * (0.07 + Math.random() * 0.09); burst(0.02, { ft: 'bandpass', f: 2400 + Math.random() * 900, q: 2.5, vol: 0.07, at, pan }); } };
  // its two-note chime, its sound from scene 2 on (the current game's notify)
  api.chime = (bad = 0) => {
    if (!bad) { tone(1318.5, 0.5, { vol: 0.12, rev: 0.25 }); tone(1975.5, 0.7, { vol: 0.1, at: 0.09, rev: 0.3 }); }
    else { const k = 1 - bad * 0.06; tone(1318.5 * k, 0.9, { vol: 0.12, rev: 0.5, det: -30 * bad }); tone(1975.5 * k * 0.97, 1.3, { vol: 0.09, at: 0.16 + bad * 0.05, rev: 0.6, det: -50 * bad }); }
  };
  // "dit-dit-dit": the old buzz of a phone near a speaker, when it hears something it wants
  api.dit = () => {
    if (!ctx) return;
    [0, 0.23, 0.46].forEach(at => {
      const t = T() + at, o = ctx.createOscillator(), e = g(0), f = ctx.createBiquadFilter();
      o.type = 'square'; o.frequency.value = 217; f.type = 'highpass'; f.frequency.value = 300;
      const am = ctx.createOscillator(), ag = g(0.5); am.type = 'square'; am.frequency.value = 33; am.connect(ag); ag.connect(e.gain);
      e.gain.setValueAtTime(0.0, t); e.gain.linearRampToValueAtTime(0.05, t + 0.005); e.gain.setValueAtTime(0.05, t + 0.12); e.gain.linearRampToValueAtTime(0, t + 0.14);
      o.connect(f); f.connect(e); send(e, 0, 1);
      o.start(t); am.start(t); o.stop(t + 0.16); am.stop(t + 0.16);
    });
  };
  // another phone buzzing on a table (Theo's), and the sound that doubles every vibration
  api.buzz = (len = 0.35, vol = 0.12) => { if (!ctx) return; tone(180, len, { type: 'sawtooth', vol, lp: 900, hp: 150, a: 0.01 }); burst(len, { ft: 'bandpass', f: 1600, q: 3, vol: vol * 0.4 }); };
  api.glitch = (dur = 0.3, vol = 0.18) => {
    burst(dur, { buf: shB, ft: 'bandpass', f: 400 + Math.random() * 3000, q: 0.8, vol });
    burst(dur * 0.6, { buf: shB, ft: 'highpass', f: 2000, vol: vol * 0.5, at: dur * 0.3 });
  };
  api.sent = () => tone(900, 0.18, { to: 1500, vol: 0.06 });
  api.recv = () => tone(1046, 0.3, { vol: 0.08, rev: 0.2 });
  api.open = () => burst(0.18, { ft: 'bandpass', f: 600, fto: 2400, q: 1.2, vol: 0.06 });
  api.err = () => { tone(220, 0.12, { type: 'square', vol: 0.05, lp: 1200 }); tone(196, 0.16, { type: 'square', vol: 0.05, lp: 1200, at: 0.14 }); };

  // vibration, always doubled by a sound and the edge pulse (map §5)
  api.vib = (pattern, withSound = true) => {
    Device.vibrate(pattern);
    if (withSound) { const p = Array.isArray(pattern) ? pattern : [pattern]; let at = 0; p.forEach((ms, i) => { if (i % 2 === 0 && ms > 0) { const t = at; setTimeout(() => api.buzz(Math.min(0.5, ms / 1000), 0.05), t); } at += ms; }); }
  };

  /* ---- the house: three layers, all above 150 Hz ---- */
  const LAYERS = ['wind', 'clock', 'furnace'];
  const muted = new Set(); // a person who can no longer choose you silences one layer for good (map §5, H17)
  function startLayer(k) {
    if (k === 'wind') {
      const s = ctx.createBufferSource(); s.buffer = noiseB; s.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.6;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160;
      const e = g(0), sw = g(0.5);
      const lfo = ctx.createOscillator(), lg = g(380); lfo.frequency.value = 0.06; lfo.connect(lg); lg.connect(bp.frequency);
      const lfo2 = ctx.createOscillator(), lg2 = g(0.35); lfo2.frequency.value = 0.11; lfo2.connect(lg2); lg2.connect(sw.gain);

      s.start(); lfo.start(); lfo2.start();
      return { e, stop: () => [s, lfo, lfo2].forEach(n => { try { n.stop(); } catch (er) {} }) };
    }

      const s = ctx.createBufferSource(); s.buffer = brownB; s.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 170;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      const e = g(0), hum = ctx.createOscillator(), hg = g(0.012); hum.frequency.value = 180; hum.connect(hg); hg.connect(e);
      s.connect(hp); hp.connect(lp); lp.connect(e); e.connect(houseBus); s.start(); hum.start();
      return { e, stop: () => [s, hum].forEach(n => { try { n.stop(); } catch (er) {} }) };
    }
    if (k === 'clock') {
      const e = g(0); e.connect(houseBus);
      let on = true, i = 0, next = T() + 0.2;
      const sched = () => {
        if (!on || !ctx) return;
        while (next < T() + 0.6) {
          const at = next - T(), hi = i++ % 2 === 0;
          const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), ge = g(0);
          s.buffer = noiseB; f.type = 'bandpass'; f.frequency.value = hi ? 3200 : 2600; f.Q.value = 4;
          const t = T() + at; ge.gain.setValueAtTime(0, t); ge.gain.linearRampToValueAtTime(0.5, t + 0.002); ge.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
          s.connect(f); f.connect(ge); ge.connect(e); s.start(t, Math.random()); s.stop(t + 0.06);
          next += 1;
        }
        setTimeout(sched, 250);
      };
      sched();
      return { e, stop: () => { on = false; } };
    }
  }
  const LEVEL = { wind: 0.05, clock: 0.03, furnace: 0.05 };
  // turn layers on or off: house({wind:1, furnace:1, clock:0}, seconds)
  api.house = (want, sec = 3) => {
    if (!ctx) return;
    LAYERS.forEach(k => {
      if (!(k in want)) return;
      const on = !!want[k] && !muted.has(k);
      if (on && !L[k]) { L[k] = startLayer(k); }
      if (L[k]) { const e = L[k].e.gain, t = T(); e.cancelScheduledValues(t); e.setValueAtTime(e.value, t); e.linearRampToValueAtTime(on ? LEVEL[k] * (typeof want[k] === 'number' ? want[k] : 1) : 0, t + sec); }
      if (!on && L[k]) { const r = L[k]; L[k] = null; setTimeout(() => r.stop(), sec * 1000 + 200); }

  };

    const vib = ctx.createOscillator(), vg = g(3); vib.frequency.value = 5.5; vib.connect(vg); vg.connect(osc.frequency); vib.start(t0);
    const e = g(0), F = [[700, 1200], [300, 2300], [500, 1000], [400, 2000], [600, 1700], [350, 900]];
    const b1 = ctx.createBiquadFilter(), b2 = ctx.createBiquadFilter(); b1.type = b2.type = 'bandpass'; b1.Q.value = 9; b2.Q.value = 12;

    while (t < t0 + dur) {
      const syl = 0.11 + Math.random() * 0.14, f = F[Math.floor(Math.random() * F.length)];
      b1.frequency.setValueAtTime(f[0], t); b2.frequency.setValueAtTime(f[1], t);
      e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(vol, t + syl * 0.3); e.gain.linearRampToValueAtTime(vol * 0.2, t + syl);
      t += syl + (Math.random() < 0.15 ? 0.18 : 0.02);
    }

    send(last, o.phone ? 0 : 0.5, 0.7); osc.start(t0); osc.stop(t + 0.2); vib.stop(t + 0.2);
    curMur = () => { try { osc.stop(); vib.stop(); } catch (er) {} };
  };
  api.stopMurmur = () => { if (curMur) { curMur(); curMur = null; } };

  // the sound check: the copy's key clicks and its chime (map scene 0)
  api.check = () => { api.clicks(10); setTimeout(() => api.chime(), 1300); };
  return api;
})();

/* ===== voice.js ===== */
/* ================= THE COPY'S VOICE: the phone's own speech, with the pitch slider (decision 2) =================
   Reused from the current game's A.speak, without its guess at the voice's gender: the slider alone sets the pitch,
   middle by default. The voice can't be panned, filtered or mixed; only its volume changes ("faint").
   Every line is subtitled. With Spoken voice off: subtitles only. With no working voice: subtitles over a murmur. */
const Voice = (() => {
  const SS = window.speechSynthesis;
  let voice = null, curFin = null;
  const api = { speaking: false, ttsOK: !!SS, lastVoice: '', cutByHide: 0, started: 0, ended: 0, errors: 0 };
  function pick() {
    if (!SS) return;
    const vs = SS.getVoices() || [];
    const en = vs.filter(v => /^en/i.test(v.lang)), local = en.filter(v => v.localService);
    voice = local.find(v => /en[-_]US/i.test(v.lang)) || local[0] || en[0] || vs[0] || null;
    api.lastVoice = voice ? voice.name + ' (' + voice.lang + (voice.localService ? ', on the phone' : '') + ')' : '';
    api.voiceCount = vs.length;
  }
  if (SS) { pick(); try { SS.addEventListener('voiceschanged', pick); } catch (e) { SS.onvoiceschanged = pick; } }
  // slider 0..1 -> speech pitch 0.5..1.5, middle 1.0
  api.pitch = () => 0.5 + clamp(Prefs.cross.settings.pitch, 0, 1);
  // speak nothing inside the first tap, so later lines may play
  api.warm = () => { try { if (!SS) { api.ttsOK = false; return; } const u = new SpeechSynthesisUtterance(' '); u.volume = 0; SS.speak(u); } catch (e) { api.ttsOK = false; } };

  api.speak = (text, o = {}) => new Promise(res => {
    if (skipping()) { talked(); res(); return; }
    const words = text.split(/\s+/).length, est = 900 + words * 330;
    let done = false, started = false;
    const timers = [];
    const fin = why => { if (done) return; done = true; timers.forEach(clearTimeout); if (curFin === fin) curFin = null; api.speaking = false; res(why); };
    curFin = fin; api.speaking = true;
    if (!Prefs.cross.settings.voice) { timers.push(setTimeout(() => fin('subtitles'), est + 600)); return; }
    if (!api.ttsOK || !SS || o.mute) { A.murmur(est / 1000, o.faint ? 0.03 : 0.07); timers.push(setTimeout(() => fin('murmur'), est + 400)); return; }
    try {
      SS.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[—…]/g, ', '));
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = o.rate || 0.95; u.pitch = api.pitch();
      u.volume = o.faint ? 0.35 : (o.vol == null ? 1 : o.vol);
      u.onstart = () => { started = true; api.started++; };
      u.onend = () => { api.ended++; timers.push(setTimeout(() => fin('spoken'), 200)); };
      u.onerror = () => { api.errors++; timers.push(setTimeout(() => fin('error'), Math.max(300, est - 500))); };
      SS.speak(u);
      timers.push(setTimeout(() => { if (!started && !done) api.ttsOK = false; }, 3000));
      timers.push(setTimeout(() => { if (!started) fin('never started'); }, est + 1500));
      timers.push(setTimeout(() => fin('too long'), est * 2.2 + 4000));
    } catch (e) { api.ttsOK = false; timers.push(setTimeout(() => fin('failed'), est)); }
  });
  api.cut = () => { try { SS && SS.cancel(); } catch (e) {} A.stopMurmur(); if (curFin) curFin('cut'); };
  // a hidden page cuts the line (Android's pause stops it for good, 07 §4.2); the subtitle has already shown it
  Bus.on('hidden', d => { if (api.speaking && !d.ignored) { api.cutByHide++; api.cut(); } }, null);

  // a spoken line with its subtitle; o.faint shows the "faint" caption (map §5: the quiet voice)
  api.line = async (text, o = {}) => {
    const sub = $('#sub');
    if (sub) {
      sub.className = 'on' + (o.faint ? ' faint' : '');
      sub.replaceChildren(...(o.faint ? [h('span', { cls: 'fa' }, Text.t('faint'))] : []), h('span', { cls: 'ln' }, text));
    }
    talked();
    await api.speak(text, o);
    await new Promise(r => setTimeout(r, o.gap == null ? 380 : o.gap));
    if (sub && !o.keep) sub.className = '';
  };
  return api;
})();

/* ===== hold.js ===== */
/* ================= HOLD: one finger, held (map: the eyes-closed hold, the walk, the erase, ending 1's thumb) =================
   Grown from the current game's hold-to-walk. Letting go early does nothing. With "Tap instead of hold",
   one tap starts it and it runs by itself; a second tap counts as letting go.
   The browser's own long-press menu, text selection and magnifier are blocked on the hold area. */
function makeHold(parent, o = {}) {
  const scope = (o.scope || G.run).child('hold');
  const ms = o.ms || 10000;
  const R = 60, C = 2 * Math.PI * R;
  const fg = o.ring === false ? null : (() => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 132 132');
    s.innerHTML = `<circle class="bgc" cx="66" cy="66" r="${R}"/><circle class="fgc" cx="66" cy="66" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>`;
    return s;
  })();
  const el = h('div', { cls: 'hold' }, fg);
  parent.append(el);
  const st = { holding: false, p: 0, done: false, pointer: null, t0: 0, base: 0, cancels: 0, menus: 0 };
  const tapMode = () => o.tap != null ? o.tap : Prefs.cross.settings.tap;
  const paint = () => { if (fg) fg.querySelector('.fgc').style.strokeDashoffset = C * (1 - st.p); };
  function frame() {
    if (!st.holding || st.done || !scope.alive) return;
    st.p = clamp(st.base + (performance.now() - st.t0) / ms, 0, 1);
    paint(); o.onProgress && o.onProgress(st.p);
    if (st.p >= 1) { st.done = true; st.holding = false; o.onDone && o.onDone(); return; }
    requestAnimationFrame(frame);
  }
  function start() { if (st.done || st.holding) return; st.holding = true; st.t0 = performance.now(); st.base = 0; o.onStart && o.onStart(); requestAnimationFrame(frame); }
  function release(why) {
    if (!st.holding || st.done) return;
    st.holding = false; st.pointer = null;
    const p = st.p; st.p = 0; paint();
    o.onRelease && o.onRelease(p, why);
  }
  scope.on(el, 'pointerdown', e => {
    e.preventDefault();
    if (tapMode()) return;
    if (st.pointer != null) return; // one finger only; a second finger is ignored
    st.pointer = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (er) {}
    start();
  });
  const up = why => e => {
    if (tapMode()) { if (why === 'up' && !st.done) st.holding ? release('tap') : start(); return; } // a tap (no click: touchstart is blocked below)
    if (e.pointerId !== st.pointer) return; if (why === 'cancel') st.cancels++; release(why);
  };
  scope.on(el, 'pointerup', up('up'));
  scope.on(el, 'pointercancel', up('cancel'));
  scope.on(el, 'lostpointercapture', up('lost'));
  // iPhone: stop the magnifier and callout from starting on a long touch
  scope.on(el, 'touchstart', e => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
  scope.on(el, 'contextmenu', e => { st.menus++; e.preventDefault(); });
  // a hidden page lets go
  Bus.on('hidden', () => release('hidden'), scope);
  return {
    el, st,
    reset() { st.done = false; st.holding = false; st.p = 0; st.pointer = null; paint(); },
    destroy() { scope.end(); el.remove(); }
  };
}

/* ===== field.js ===== */
/* ================= THE FIELD THE GAME DRAWS: real typing, never saved (decision 5) =================
   A real text box (the phone's own keyboard) with transparent text, over a layer that shows the same text
   with the copy's one change underlined in dots (R2: "change or add one word ... tap it to take yours back").
   Android keyboards handle editable page areas badly, so the box itself stays a plain textarea.
   Nothing typed is ever written to storage, the address, or history; the text lives only in this element,
   and is wiped when the field goes. The game reacts only to: send versus a let, deletions, timing,
   and whether the copy's change was left in. */
function makeField(parent, o = {}) {
  const scope = (o.scope || G.run).child('field');
  const ta = h('textarea', { rows: 1, autocomplete: 'off', autocapitalize: 'sentences', enterkeyhint: 'send', 'aria-label': o.label || '', placeholder: o.placeholder || '' });
  // o.noSuggest asks the keyboard for no suggestions or autocorrect (being tried in phone check 0, round 2)
  if (o.noSuggest) { ta.setAttribute('spellcheck', 'false'); ta.setAttribute('autocorrect', 'off'); ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off'); }
  const mir = h('div', { cls: 'mir', 'aria-hidden': 'true' });
  const el = h('div', { cls: 'field' }, mir, ta);
  parent.append(el);
  // the changes the copy may make, as [from, to] pairs (the script's word-change list, step 3)
  const list = (o.changes || []).map(([f, t]) => [f.toLowerCase(), t]);
  const st = { change: null, takenBack: 0, changes: 0, deleteRuns: 0, keys: 0, firstAt: 0, lastAt: 0, composing: false, sent: false };
  let lastLen = 0, deleting = false;

  function render() {
    const v = ta.value; let c = st.change;
    if (c && v.slice(c.start, c.start + c.now.length) !== c.now && !locate()) { st.change = null; c = null; }
    const parts = c ? [v.slice(0, c.start), h('span', { cls: 'ch' }, c.now), v.slice(c.start + c.now.length)] : [v];
    mir.replaceChildren(...parts.filter(p => p !== ''), '\u200b');
    grow();
  }
  // after an edit before it, find the change again near where it was
  function locate() {
    const c = st.change, v = ta.value; if (!c) return false;
    let best = -1, bd = 1e9, i = v.indexOf(c.now);
    while (i >= 0) { const d = Math.abs(i - c.start); if (d < bd) { bd = d; best = i; } i = v.indexOf(c.now, i + 1); }
    if (best < 0 || (c.suffix && best + c.now.length !== v.length)) return false;
    c.start = best; return true;
  }
  function grow() { ta.style.height = 'auto'; const hgt = Math.min(ta.scrollHeight, 120); ta.style.height = hgt + 'px'; mir.scrollTop = ta.scrollTop; }

  // the copy changes one negative word, just after you finish it
  function maybeChange() {
    if (!list.length || st.change || st.takenBack || st.composing) return;
    const v = ta.value, caret = ta.selectionStart;
    const m = /([A-Za-z'’]+)([\s.,!?;:]+)$/.exec(v.slice(0, caret));
    if (!m) return;
    const word = m[1], start = caret - m[0].length;
    const hit = list.find(([f]) => f === word.toLowerCase().replace('’', "'"));
    if (!hit) return;

  }
  // scene 1: it adds a word at the end (" x"); your typing goes in before it
  function keepSuffix() {
    const c = st.change; if (!c || !c.suffix) return;
    const v = ta.value;
    if (!v.length) { st.change = null; return; } // you cleared the whole field: its word goes with it

    const now = performance.now(); st.keys++; st.lastAt = now; if (!st.firstAt) st.firstAt = now;
    const len = ta.value.length;

    lastLen = len;

  scope.on(ta, 'click', () => {

  const api = {
    el, ta, st,
    value: () => ta.value,
    focus() { ta.focus(); },
    addSuffix(text) { if (st.change || st.takenBack) return; const v = ta.value; ta.value = v + text; st.change = { start: v.length, now: text, orig: '', suffix: true }; st.changes++; lastLen = ta.value.length; const c = v.length; ta.setSelectionRange(c, c); render(); },

  };
  render();

}

// game-made sound: a wordless voice in the telephone band, rendered into a WAV in memory and played by an audio element
function renderCallSound(sec = 8) {
  const sr = 22050, n = sr * sec, d = new Float32Array(n);
  // two state-variable band-pass filters shape a buzz into vowel-like sounds, one syllable at a time

  let ph = 0, syl = 0, len = 1, gap = false;

    if (--syl <= 0) { len = syl = Math.floor(sr * (0.12 + Math.random() * 0.16)); gap = Math.random() < 0.12; const f = FS[Math.floor(Math.random() * FS.length)]; b1.set(f[0]); b2.set(f[1]); }
    const env = gap ? 0 : Math.sin(Math.PI * (1 - syl / len));
    ph += (150 + 3 * Math.sin(i / sr * 2 * Math.PI * 5.5)) / sr; if (ph > 1) ph -= 1;
    const saw = 2 * ph - 1;
    d[i] = (b1.run(saw) + b2.run(saw)) * env * 0.35;
  }
  // 300-3400 Hz, roughly: a one-pole high-pass and low-pass
  let hp = 0, lp = 0, px = 0; const ah = 1 / (1 + 2 * Math.PI * 300 / sr), al2 = 2 * Math.PI * 3400 / sr / (1 + 2 * Math.PI * 3400 / sr);
  for (let i = 0; i < n; i++) { hp = ah * (hp + d[i] - px); px = d[i]; lp += al2 * (hp - lp); d[i] = clamp(lp * 1.6, -1, 1); }
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, d[i] * 32767, true);

}

  const t = R.typing;
  $('#typeres').innerHTML = [t.changed != null ? `Word changed to "do": ${ok(t.changed)}` : 'Not tried yet', t.takenBack != null ? `Tapped back to "don't": ${ok(t.takenBack)}` : '',
    t.kbSeen ? `Field above the keyboard: ${ok(t.visible !== false)}` : '', t.sent ? `Sent: ${ok(true)}` : ''].filter(Boolean).join('\n');
  const hd = R.hold;
  $('#holdres').innerHTML = hd.done == null && hd.early == null ? 'Not tried yet' : [`Ring filled: ${ok(!!hd.done)}`, hd.early ? `Let go early: ${hd.early} time(s)` : '', hd.cancels != null ? `Browser took the touch away: ${hd.cancels ? `<span class="bad">${hd.cancels} time(s)</span>` : 'no'}` : '', hd.menus ? `<span class="bad">Menu requests: ${hd.menus}</span>` : ''].filter(Boolean).join('\n');
  const cm = R.camera;
  $('#camres').innerHTML = cm.got == null && !cm.error ? 'Not tried yet' : [cm.error ? `<span class="bad">Camera failed: ${cm.error}</span>` : `Camera: ${ok(cm.got)} · one frame: ${ok(cm.frame)} · camera off after: ${ok(cm.stopped)}`, `The browser's prompt hid the page: ${cm.hiddenByPrompt ? 'yes' : 'no'}`].join('\n');
  $('#npres').innerHTML = R.np.played == null ? 'Not tried yet' : `Call sound played: ${ok(R.np.played)}${R.np.error ? ' (' + R.np.error + ')' : ''}`;
  $('#all').textContent = summary();
}
function summary() {
  const a = R.answers, yn = v => v == null ? '?' : v ? 'yes' : 'no';
  return [
    'PHONE CHECK 0 RESULTS', new Date().toString(), 'Opened: ' + info.opened, 'Browser: ' + info.browser,
    'Screen kept awake: ' + (Device.isAwake() ? 'on' : 'off') + (Device.awakeError ? ' (refused: ' + Device.awakeError + ')' : ''),
    'Has: ' + Object.entries(info).filter(([k, v]) => typeof v === 'boolean').map(([k, v]) => k + '=' + (v ? 'yes' : 'no')).join(', '),
    '1 LOCK: ' + (R.lock.map((e, i) => `#${i + 1} ${secs(e.ms)} before[full=${e.before.full},awake=${e.before.awake},sound=${e.before.sound}]` + (e.after ? ` after[full=${e.after.full},awake=${e.after.awake},sound=${e.after.sound}]` : ' after[no tap]')).join('; ') || 'not done'),
    `2 VOICE: voice=${R.voice.name || Voice.lastVoice || 'none'} listed=${Voice.voiceCount || 0} spoke=${yn(R.voice.spoke)} quiet=${yn(R.voice.faint)} offline=${yn(R.voice.offline)} cutByLock=${yn(R.voice.lockCut)} keptTalkingLocked=${yn(a.voiceKept)} pitchHeard=${yn(a.pitchHeard)} pitch=${Prefs.cross.settings.pitch}`,
    `3 TYPING: changed=${yn(R.typing.changed)} tookBack=${yn(R.typing.takenBack)} keyboardSeen=${yn(R.typing.kbSeen)} fieldVisible=${yn(R.typing.visible)} sent=${yn(R.typing.sent)} keyboardFought=${yn(a.kbFight)} couldSee=${yn(a.kbSee)}`,
    `3B TYPING, NO SUGGESTIONS: changed=${yn((R.typingB || {}).changed)} tookBack=${yn((R.typingB || {}).takenBack)} keyboardFought=${yn(a.kbFightB)} better=${a.kbBetter == null ? '?' : a.kbBetter ? 'B' : 'first'}`,
    `4 HOLD: filled=${yn(R.hold.done)} early=${R.hold.early || 0} cancels=${R.hold.cancels == null ? '?' : R.hold.cancels} menus=${R.hold.menus || 0} popup=${yn(a.holdMenuPop)} magnifierOrSelection=${yn(a.holdMagnifier)} buzz=${yn(a.holdBuzz)} other=${yn(a.holdOther)}`,
    `5 CAMERA: got=${yn(R.camera.got)} frame=${yn(R.camera.frame)} off=${yn(R.camera.stopped)} promptHidPage=${yn(R.camera.hiddenByPrompt)} error=${R.camera.error || '-'} readsNormally=${yn(a.camWay)}`,
    `6 NOW PLAYING: played=${yn(R.np.played)} inShade=${yn(a.npShade)} voiceKept=${yn(a.npCut)}`,
    `SIGNAL: online=${navigator.onLine} changes=${R.net}`,
    'LOG: ' + Device.log.slice(-25).map(l => `${l.what}${l.ms != null ? ' ' + l.ms + 'ms' : ''}`).join(' | ')
  ].join('\n');
}
async function copy() {
  const s = summary();
  try { await navigator.clipboard.writeText(s); $('#all').textContent = 'Copied. Paste it to Claude Code.\n\n' + s; }
  catch (e) { $('#all').textContent = s; const sel = getSelection(), r = document.createRange(); r.selectNodeContents($('#all')); sel.removeAllRanges(); sel.addRange(r); }
}
update();
setInterval(() => { if (!document.hidden) $('#sig').textContent = `Signal flag: ${navigator.onLine ? 'online' : 'offline'} · changes seen: ${R.net}`; }, 1000);

</script>
